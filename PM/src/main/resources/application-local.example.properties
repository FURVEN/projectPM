# ============================================================================
# 로컬 개발 설정 예시 파일
#
# 사용법:
#   1. 이 파일을 같은 디렉터리에 application-local.properties 로 복사한다.
#      (application-local.properties 는 .gitignore 에 등록되어 커밋되지 않는다)
#   2. 아래 값을 본인 환경에 맞게 채운다.
#
# 파일 대신 시스템 프로퍼티(-Dpm.datasource.username=...) 또는
# 환경변수(PM_DATASOURCE_USERNAME=...)로도 주입할 수 있다.
# (환경변수가 파일 값보다 우선한다)
#
# 절대 실제 비밀번호/키를 이 example 파일에 적지 말 것.
# ============================================================================

# --- Oracle DataSource (root-context.xml) ---
pm.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
pm.datasource.url=jdbc:oracle:thin:@127.0.0.1:1521:xe
pm.datasource.username=CHANGE_ME
pm.datasource.password=CHANGE_ME

# --- AES256 암호화 키 (servlet-context.xml 의 aes 빈) ---
# 16자 이상. 앞 16자가 IV로 사용된다.
# 주의: 기존 DB에 이전 키로 암호화되어 저장된 데이터가 있다면
#       그 데이터를 복호화하기 위해 동일한 키를 유지해야 한다.
pm.crypto.aes-key=CHANGE_ME_16CHAR

# --- SMTP 메일 발송 (com.project.pm.common.GoogleMail / MySMTPAuthenticator) ---
# Gmail 사용 시: 계정 아이디(@gmail.com 제외)와 "앱 비밀번호"를 사용한다.
# 이 값들은 시스템 프로퍼티/환경변수로만 읽힌다.
#   -Dpm.mail.smtp.user=...  또는 환경변수 PM_MAIL_SMTP_USER
#   -Dpm.mail.smtp.password=...  또는 환경변수 PM_MAIL_SMTP_PASSWORD
pm.mail.smtp.user=CHANGE_ME
pm.mail.smtp.password=CHANGE_ME
